server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unmatched paths fall back to index.html.
    location / {
        try_files $uri /index.html;
    }

    # Forwards to the api service on the docker compose network. SSE
    # (/api/chat/stream) needs buffering off so tokens flush immediately.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
